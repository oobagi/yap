name: Electron Build

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/electron-build.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/electron-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            artifact-name: yap-electron-macos
          - platform: windows-latest
            artifact-name: yap-electron-windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/native-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/native-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Check renderer
        working-directory: desktop
        run: pnpm run check

      - name: Check Electron main/preload
        working-directory: desktop
        run: pnpm run electron:check

      - name: Test macOS signing password handling
        working-directory: desktop
        run: pnpm run electron:test-signing

      - name: Test native runtime
        working-directory: desktop
        run: cargo test --locked --manifest-path native-core/Cargo.toml --lib

      - name: Clean previous Electron outputs
        working-directory: desktop
        shell: bash
        run: rm -rf release-electron dist-electron

      - name: Check macOS auto-update signing secrets
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          missing=()
          [[ -n "$CSC_LINK" ]] || missing+=(CSC_LINK)
          [[ -n "$CSC_KEY_PASSWORD" ]] || missing+=(CSC_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing macOS signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          has_api_key=false
          if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            has_api_key=true
          fi

          has_apple_id=false
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            has_apple_id=true
          fi

          has_keychain_profile=false
          if [[ -n "$APPLE_KEYCHAIN_PROFILE" ]]; then
            has_keychain_profile=true
          fi

          if [[ "$has_api_key" != true && "$has_apple_id" != true && "$has_keychain_profile" != true ]]; then
            echo "Missing notarization credentials. Set APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER, APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID, or APPLE_KEYCHAIN_PROFILE." >&2
            exit 1
          fi

      - name: Package Electron app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [[ "${RUNNER_OS:-}" != "macOS" || "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            unset APPLE_KEYCHAIN APPLE_KEYCHAIN_PROFILE
          elif [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_ID:-}" && ( ! -f "${APPLE_API_KEY}" ) ]]; then
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            if [[ "${APPLE_API_KEY}" == *"BEGIN PRIVATE KEY"* ]]; then
              printf '%s\n' "${APPLE_API_KEY}" > "${key_path}"
            elif printf '%s' "${APPLE_API_KEY}" | base64 --decode > "${key_path}" 2>/dev/null; then
              :
            else
              printf '%s\n' "${APPLE_API_KEY}" > "${key_path}"
            fi
            chmod 600 "${key_path}"
            export APPLE_API_KEY="${key_path}"
          fi

          pnpm run electron:package:ci

      - name: Verify macOS entitlements
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          YAP_REQUIRE_MAC_TRUSTED_SIGNING: "1"
        run: pnpm run electron:verify-mac-entitlements

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/release-electron/*.dmg
            desktop/release-electron/*.zip
            desktop/release-electron/*.exe
            desktop/release-electron/*.blockmap
            desktop/release-electron/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: yap-electron-macos
          path: artifacts/electron

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: yap-electron-windows
          path: artifacts/electron

      - name: Publish Electron release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/electron/**/*.dmg
            artifacts/electron/**/*.zip
            artifacts/electron/**/*.exe
            artifacts/electron/**/*.blockmap
            artifacts/electron/**/latest*.yml
