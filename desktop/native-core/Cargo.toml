[package]
name = "yap"
version = "4.3.1"
description = "Yap - Cross-platform voice-to-text"
authors = ["igaboo"]
edition = "2021"
default-run = "yap-core"

[features]
default = ["local-whisper-native"]
local-whisper-native = ["dep:whisper-rs"]

[lib]
name = "yap_core_lib"

[[bin]]
name = "yap-core"
path = "src/yap_core.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture and processing
cpal = "0.15"
hound = "3.5"
rustfft = "6.2"
earshot = "1.1.0"
whisper-rs = { version = "0.16", optional = true }

# HTTP and JSON
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }

# Clipboard and input simulation
enigo = "0.2"
arboard = "3"

# Audio playback (sound effects)
rodio = "0.19"

# Base64 encoding for API calls
base64 = "0.22"

# UUID generation for history entries
uuid = { version = "1", features = ["v4"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Directory paths
dirs = "5"

# Lazy statics
once_cell = "1"

# Font rasterization (Windows overlay text)
fontdue = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
# 2D rendering for native overlay pill
tiny-skia = "0.11"
windows = { version = "0.58", features = [
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
] }
