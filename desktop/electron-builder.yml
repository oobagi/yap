appId: com.yap.desktop
productName: Yap
asar: true
publish:
  provider: github
  owner: oobagi
  repo: yap
directories:
  output: release-electron
files:
  - build/**/*
  - dist-electron/**/*
  - native-core/icons/**/*
  - package.json
extraResources:
  - from: native-core/target/release
    to: bin
    filter:
      - yap-core
      - yap-core.exe
  - from: native-core/binaries
    to: bin
    filter:
      - yap-overlay-*-apple-darwin
      - yap-speech-*-apple-darwin
      - yap-format-*-apple-darwin
  - from: native-core/sounds
    to: sounds
mac:
  category: public.app-category.productivity
  icon: native-core/icons/icon.icns
  minimumSystemVersion: "26.0"
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    LSMinimumSystemVersion: "26.0"
    NSMicrophoneUsageDescription: Yap records your voice so it can transcribe and paste what you say.
    NSSpeechRecognitionUsageDescription: Yap uses Apple SpeechAnalyzer to transcribe audio locally on macOS 26 or newer.
  target:
    - dmg
    - zip
win:
  icon: native-core/icons/icon.ico
  target:
    - nsis
linux:
  category: Utility
  icon: native-core/icons
  target:
    - AppImage
